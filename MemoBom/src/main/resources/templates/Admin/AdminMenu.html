<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="Menu">

	<th:block th:with="path=${currentPath}">

		<nav class="text-dynamic-sm space-y-1">

			<!-- Dashboard -->
			<a th:href="@{/Lotus/index.html}" th:class="|flex items-center gap-2 px-3 py-2 rounded-xl transition
			           ${path == '/Lotus/index.html' ? 'bg-slate-900 text-white shadow' : 'text-slate-700 hover:bg-gray-100'}|"
				onclick="AdminMenu.closeIfMobile()">
				<span class="w-1.5 h-1.5 rounded-full"
					th:classappend="${path == '/Lotus/index.html' ? 'bg-white' : 'bg-slate-300'}"></span>
				<span class="font-medium">Dashboard</span>
			</a>

			<div class="my-2 border-t border-gray-200"></div>

			<!-- Users -->
			<a th:href="@{/Lotus/User.html}" th:class="|flex items-center gap-2 px-3 py-2 rounded-xl transition

				<span class="w-1.5 h-1.5 rounded-full"
					th:classappend="${path == '/Lotus/User.html' ? 'bg-white' : 'bg-slate-300'}"></span>
				<span class="font-medium">User</span>
			</a>

			<a th:href="@{/Lotus/Topic.html}" th:class="|flex items-center gap-2 px-3 py-2 rounded-xl transition

			</a>

			<a th:href="@{/Lotus/Fragment.html}"
				th:class="|flex items-center gap-2 px-3 py-2 rounded-xl transition

			<a th:href="@{/Lotus/Emotion.html}"

			<a th:href="@{/Lotus/Setting.html}"
