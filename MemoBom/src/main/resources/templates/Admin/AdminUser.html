<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{Admin/AdminLayout}">

<body>
	<th:block layout:fragment="admin_title">User</th:block>
	<th:block layout:fragment="admin_content">
		<div class="w-full max-w-7xl mx-auto space-y-4">
			<div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
				<div class="flex flex-col md:flex-row md:items-center gap-3">
					<div class="flex items-center gap-2">
						<label for="searchDate" class="text-sm font-medium text-slate-600">조회일</label>
						<input id="searchDate" type="date" name="date" th:value="${date}"
							class="h-10 px-3 rounded-xl border border-slate-300 text-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-slate-400">
					</div>
					<input id="keyword" type="text" name="keyword" placeholder="검색어 (아이디/이메일/별명/로그인 방식)"
						class="w-full md:w-[420px] h-10 px-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
				</div>
			</div>

			<div id="userList" class="space-y-3"></div>
			<div id="pageSentinel" class="h-1"></div>
		</div>

		<template id="tplUserCard">
			<article class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
				<div class="p-3">
					<div class="grid grid-cols-[88px_1fr] gap-3">
						<img class="profile w-[88px] h-[88px] rounded-xl object-cover border border-slate-200 bg-slate-50" alt="profile">
						<div class="min-w-0">
							<div class="flex items-center gap-2">
								<div class="id text-lg font-semibold text-slate-900 truncate">-</div>
								<span class="enabled px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">활성</span>
							</div>
							<div class="mt-1 text-sm text-slate-600">
								<span class="userNoWrap">userNo: <span class="userNo tabular-nums">0</span></span>
							</div>
							<div class="mt-1 grid grid-cols-2 gap-x-2 text-sm text-slate-600">
								<div>role: <span class="role">-</span></div>
								<div>provider: <span class="provider">-</span></div>
							</div>
							<div class="mt-1 flex items-center gap-2 text-sm text-slate-600">
								<span>Enabled</span>
								<pp-toggle class="enabledToggle" on-text="ON" off-text="OFF"></pp-toggle>
							</div>
						</div>
					</div>
					<div class="mt-2 grid grid-cols-2 gap-x-3 text-sm text-slate-600">
						<div>regDate: <span class="regDate tabular-nums">-</span></div>
						<div>updateDate: <span class="updateDate tabular-nums">-</span></div>
					</div>
					<div class="mt-2">
						<input type="text"
							class="noteInput w-full h-9 px-3 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
							placeholder="노트 입력">
					</div>
					<div class="mt-1 text-xs text-slate-400">노트는 입력 후 포커스가 벗어나면 자동 저장됩니다.</div>
							</div>
			</article>
		</template>
		</th:block>
	
	<th:block layout:fragment="admin_script">
		<script type="text/javascript" th:src="@{/js/ToggleButton.js(v=${assetVersion})}"></script>
		<script th:inline="javascript">
			(() => {
				const PAGE_SIZE = 20;
				const url = /*[[@{/Lotus/UserList.json}]]*/ '/Lotus/UserList.json';
				const noteSaveUrl = /*[[@{/Lotus/UserNoteSave.json}]]*/ '/Lotus/UserNoteSave.json';
				const enabledSaveUrl = /*[[@{/Lotus/UserEnabledSave.json}]]*/ '/Lotus/UserEnabledSave.json';
				const defaultProfile = /*[[@{/images/profile-placeholder.svg}]]*/ '/images/profile-placeholder.svg';

				const elList = document.getElementById('userList');
				const elSentinel = document.getElementById('pageSentinel');
				const elDate = document.getElementById('searchDate');
				const elKeyword = document.getElementById('keyword');
				const tpl = document.getElementById('tplUserCard');

				let pageNo = 1;
				let loading = false;
				let done = false;
				let observer = null;

				function toastInfo(msg) {
					showToast('안내', msg, ToastType.INFO, 1400);
				}

				function toastSuccess(msg) {
					showToast('완료', msg, ToastType.SUCCESS, 1200);
				}

				function toastError(msg) {
					showToast('오류', msg, ToastType.ERROR, 1800);
				}

				function text(v, fallback = '-') {
					if (v === null || v === undefined) return fallback;
					const s = String(v).trim();
					return s ? s : fallback;
				}

				function renderItem(item) {
					const node = tpl.content.firstElementChild.cloneNode(true);

					const profile = text(item.profileUrl, defaultProfile);
					node.querySelector('.profile').src = profile;
					node.querySelector('.profile').onerror = (e) => { e.target.src = defaultProfile; };

						node.querySelector('.id').textContent = text(item.id);
						node.querySelector('.userNo').textContent = text(item.userNo, '0');
					node.querySelector('.provider').textContent = text(item.provider);
					node.querySelector('.role').textContent = text(item.role);
					node.querySelector('.regDate').textContent = text(item.regDate);
					node.querySelector('.updateDate').textContent = text(item.updateDate);
					const noteInput = node.querySelector('.noteInput');
					noteInput.value = text(item.note, '');

						let lastSavedNote = text(item.note, '');
						let noteSaving = false;

						noteInput.addEventListener('blur', async () => {
							const nextNote = text(noteInput.value, '');
							if (noteSaving || nextNote === lastSavedNote) return;

							noteSaving = true;
							noteInput.setAttribute('disabled', '');
							try {
								const res = await apiPost(noteSaveUrl, {
									userNo: item.userNo,
									note: nextNote
								});
								if (!res || res.code !== '0') {
									throw new Error((res && res.message) || '노트 저장 실패');
								}
								lastSavedNote = nextNote;
									toastSuccess(`사용자 ${item.userNo}의 노트를 저장했습니다.`);
								} catch (err) {
									console.error(err);
									noteInput.value = lastSavedNote;
									toastError('노트 저장 중 오류가 발생했습니다.');
								} finally {
								noteInput.removeAttribute('disabled');
								noteSaving = false;
							}
						});

						const enabled = !!item.enabled;
						const enabledEl = node.querySelector('.enabled');
						enabledEl.textContent = enabled ? '활성' : '비활성';
						enabledEl.classList.remove('bg-slate-100', 'text-slate-700', 'bg-emerald-100', 'text-emerald-700');
						if (enabled) enabledEl.classList.add('bg-emerald-100', 'text-emerald-700');
						else enabledEl.classList.add('bg-slate-100', 'text-slate-700');

						const enabledToggle = node.querySelector('.enabledToggle');
						enabledToggle.checked = enabled;
						enabledToggle.addEventListener('change', async (e) => {
							const next = !!(e.detail && e.detail.checked);
							const prev = !next;
							enabledToggle.setAttribute('disabled', '');
							try {
								const res = await apiPost(enabledSaveUrl, {
									userNo: item.userNo,
									enabled: next
								});
								if (!res || res.code !== '0') {
									throw new Error((res && res.message) || '활성 상태 변경 실패');
								}

								enabledEl.textContent = next ? '활성' : '비활성';
								enabledEl.classList.remove('bg-slate-100', 'text-slate-700', 'bg-emerald-100', 'text-emerald-700');
								if (next) enabledEl.classList.add('bg-emerald-100', 'text-emerald-700');
								else enabledEl.classList.add('bg-slate-100', 'text-slate-700');
									toastSuccess(`사용자 ${item.userNo}의 활성 상태를 저장했습니다.`);
								} catch (err) {
									console.error(err);
									enabledToggle.checked = prev;
									toastError('활성 상태 저장 중 오류가 발생했습니다.');
								} finally {
								enabledToggle.removeAttribute('disabled');
							}
						});

						return node;
					}

				async function loadNextPage() {
					if (loading || done) return;
					loading = true;
						try {
						const res = await apiGetWithParam(url, {
							date: elDate.value,
							keyword: elKeyword.value,
							pageNo
						});

						if (!res || res.code !== '0') {
							throw new Error((res && res.message) || '사용자 목록 조회 실패');
						}

						const list = Array.isArray(res.data) ? res.data : [];

							if (list.length === 0 && pageNo === 1) {
								elList.innerHTML = '';
								done = true;
								toastInfo('조회 결과가 없습니다.');
								return;
							}

						const frag = document.createDocumentFragment();
						list.forEach((item) => frag.appendChild(renderItem(item)));
						elList.appendChild(frag);

							pageNo += 1;
							done = list.length < PAGE_SIZE;
						} catch (err) {
							console.error(err);
							toastError('사용자 목록 조회 중 오류가 발생했습니다.');
						} finally {
						loading = false;
					}
				}

				async function reload() {
					pageNo = 1;
					done = false;
					loading = false;
					elList.innerHTML = '';
					await loadNextPage();
				}

				function openDatePicker() {
					if (typeof elDate.showPicker === 'function') {
						elDate.showPicker();
					}
				}

				function initEvents() {
					elDate.addEventListener('click', openDatePicker);
					elDate.addEventListener('focus', openDatePicker);
					elDate.addEventListener('change', reload);

					elKeyword.addEventListener('keydown', async (e) => {
						if (e.key !== 'Enter') return;
						e.preventDefault();
						await reload();
					});
				}

				function initInfiniteScroll() {
					if (window.AdminUtils && typeof window.AdminUtils.createInfiniteObserver === 'function') {
						observer = window.AdminUtils.createInfiniteObserver(elSentinel, async () => {
							await loadNextPage();
						});
					}
				}

				async function init() {
					initEvents();
					initInfiniteScroll();
					await reload();
				}

				window.addEventListener('DOMContentLoaded', init);
			})();
		</script>
		
	</th:block>
</body>
</html>
