<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{Admin/AdminLayout}">

<body>
	<th:block layout:fragment="admin_title">User</th:block>
	<th:block layout:fragment="admin_content">
		<div class="w-full max-w-7xl mx-auto space-y-4">
			<div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
				<div class="flex flex-col md:flex-row md:items-center gap-3">
					<div class="flex items-center gap-2">
						<label for="searchDate" class="text-sm font-medium text-slate-600">조회일</label>
						<input id="searchDate" type="date" name="date" th:value="${date}"
							class="h-10 px-3 rounded-xl border border-slate-300 text-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-slate-400">
					</div>
					<input id="keyword" type="text" name="keyword" placeholder="검색어 (id/email/nickname/provider)"
						class="w-full md:w-[420px] h-10 px-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
				</div>
			</div>

			<div id="userList" class="space-y-3"></div>
			<div id="stateBox" class="hidden rounded-2xl border p-3 text-sm"></div>
			<div id="pageSentinel" class="h-1"></div>
		</div>

		<template id="tplUserCard">
			<article class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
				<div class="grid grid-cols-[96px_1fr] md:grid-cols-[120px_1fr] gap-3 p-4">
					<img class="profile w-24 h-24 md:w-28 md:h-28 rounded-xl object-cover border border-slate-200 bg-slate-50"
						alt="profile">
					<div class="min-w-0">
						<div class="flex items-center gap-2 flex-wrap">
							<div class="nickname text-base font-semibold text-slate-900 truncate">-</div>
							<span class="enabled px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">-</span>
						</div>
						<div class="mt-1 text-sm text-slate-600">
							<span class="id">-</span> · <span class="email">-</span>
						</div>
						<div class="mt-2 grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-500">
							<div>userNo: <span class="userNo tabular-nums">0</span></div>
							<div>provider: <span class="provider">-</span></div>
							<div>role: <span class="role">-</span></div>
							<div>regDate: <span class="regDate tabular-nums">-</span></div>
							<div>updateDate: <span class="updateDate tabular-nums">-</span></div>
						</div>
							<div class="mt-2 flex flex-col md:flex-row gap-2">
								<input type="text"
									class="noteInput flex-1 h-9 px-3 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
									placeholder="note 입력">
								<div class="flex items-center gap-2">
									<button type="button"
										class="btnSaveNote h-9 px-3 rounded-lg border border-slate-300 bg-white text-sm text-slate-700 hover:bg-slate-50">
										note 저장
									</button>
									<button type="button"
										class="btnDeleteUser h-9 px-3 rounded-lg border border-red-300 bg-red-50 text-sm text-red-700 hover:bg-red-100">
										사용자 삭제
									</button>
								</div>
							</div>
						</div>
					</div>
				</article>
			</template>
	</th:block>
	
	<th:block layout:fragment="admin_script">
		<script th:inline="javascript">
			(() => {
				const PAGE_SIZE = 20;
				const url = /*[[@{/Lotus/UserList.json}]]*/ '/Lotus/UserList.json';
				const noteSaveUrl = /*[[@{/Lotus/UserNoteSave.json}]]*/ '/Lotus/UserNoteSave.json';
				const userDeleteUrl = /*[[@{/Lotus/UserDelete.json}]]*/ '/Lotus/UserDelete.json';
				const defaultProfile = /*[[@{/images/profile-placeholder.svg}]]*/ '/images/profile-placeholder.svg';

				const elList = document.getElementById('userList');
				const elState = document.getElementById('stateBox');
				const elSentinel = document.getElementById('pageSentinel');
				const elDate = document.getElementById('searchDate');
				const elKeyword = document.getElementById('keyword');
				const tpl = document.getElementById('tplUserCard');

				let pageNo = 1;
				let loading = false;
				let done = false;
				let observer = null;

				function showState(type, text) {
					elState.classList.remove('hidden');
					elState.textContent = text;
					elState.classList.remove(
						'bg-red-50', 'border-red-200', 'text-red-700',
						'bg-slate-50', 'border-slate-200', 'text-slate-700'
					);
					if (type === 'err') elState.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
					else elState.classList.add('bg-slate-50', 'border-slate-200', 'text-slate-700');
				}

				function hideState() {
					elState.classList.add('hidden');
					elState.textContent = '';
				}

				function text(v, fallback = '-') {
					if (v === null || v === undefined) return fallback;
					const s = String(v).trim();
					return s ? s : fallback;
				}

				function renderItem(item) {
					const node = tpl.content.firstElementChild.cloneNode(true);

					const profile = text(item.profileUrl, defaultProfile);
					node.querySelector('.profile').src = profile;
					node.querySelector('.profile').onerror = (e) => { e.target.src = defaultProfile; };

					node.querySelector('.nickname').textContent = text(item.nickname);
					node.querySelector('.id').textContent = text(item.id);
					node.querySelector('.email').textContent = text(item.email);
					node.querySelector('.userNo').textContent = text(item.userNo, '0');
					node.querySelector('.provider').textContent = text(item.provider);
					node.querySelector('.role').textContent = text(item.role);
					node.querySelector('.regDate').textContent = text(item.regDate);
					node.querySelector('.updateDate').textContent = text(item.updateDate);
					const noteInput = node.querySelector('.noteInput');
					noteInput.value = text(item.note, '');

					const btnSaveNote = node.querySelector('.btnSaveNote');
					btnSaveNote.addEventListener('click', async () => {
						btnSaveNote.disabled = true;
						try {
							const res = await apiPost(noteSaveUrl, {
								userNo: item.userNo,
								note: noteInput.value
							});
							if (!res || res.code !== '0') {
								throw new Error((res && res.message) || 'note 저장 실패');
							}
							showState('info', `userNo ${item.userNo} note 저장 완료`);
						} catch (err) {
							console.error(err);
							showState('err', 'note 저장 중 오류가 발생했습니다.');
						} finally {
							btnSaveNote.disabled = false;
						}
					});

					const btnDeleteUser = node.querySelector('.btnDeleteUser');
					btnDeleteUser.addEventListener('click', async () => {
						const ok = window.confirm(`userNo ${item.userNo} 사용자를 삭제하시겠습니까?`);
						if (!ok) return;

						btnDeleteUser.disabled = true;
						try {
							const res = await apiPost(userDeleteUrl, { userNo: item.userNo });
							if (!res || res.code !== '0') {
								throw new Error((res && res.message) || '사용자 삭제 실패');
							}
							node.remove();
							showState('info', `userNo ${item.userNo} 삭제 완료`);
						} catch (err) {
							console.error(err);
							showState('err', '사용자 삭제 중 오류가 발생했습니다.');
						} finally {
							btnDeleteUser.disabled = false;
						}
					});

					const enabled = !!item.enabled;
					const enabledEl = node.querySelector('.enabled');
					enabledEl.textContent = enabled ? '활성' : '비활성';
					enabledEl.classList.remove('bg-slate-100', 'text-slate-700', 'bg-emerald-100', 'text-emerald-700');
					if (enabled) enabledEl.classList.add('bg-emerald-100', 'text-emerald-700');
					else enabledEl.classList.add('bg-slate-100', 'text-slate-700');

					return node;
				}

				async function loadNextPage() {
					if (loading || done) return;
					loading = true;
					showState('info', '사용자 목록을 불러오는 중…');

					try {
						const res = await apiGetWithParam(url, {
							date: elDate.value,
							keyword: elKeyword.value,
							pageNo
						});

						if (!res || res.code !== '0') {
							throw new Error((res && res.message) || '사용자 목록 조회 실패');
						}

						const list = Array.isArray(res.data) ? res.data : [];

						if (list.length === 0 && pageNo === 1) {
							elList.innerHTML = '';
							done = true;
							showState('info', '조회 결과가 없습니다.');
							return;
						}

						const frag = document.createDocumentFragment();
						list.forEach((item) => frag.appendChild(renderItem(item)));
						elList.appendChild(frag);

						pageNo += 1;
						done = list.length < PAGE_SIZE;

						if (done) showState('info', '마지막 페이지입니다.');
						else hideState();
					} catch (err) {
						console.error(err);
						showState('err', '사용자 목록 조회 중 오류가 발생했습니다.');
					} finally {
						loading = false;
					}
				}

				async function reload() {
					pageNo = 1;
					done = false;
					loading = false;
					elList.innerHTML = '';
					await loadNextPage();
				}

				function openDatePicker() {
					if (typeof elDate.showPicker === 'function') {
						elDate.showPicker();
					}
				}

				function initEvents() {
					elDate.addEventListener('click', openDatePicker);
					elDate.addEventListener('focus', openDatePicker);
					elDate.addEventListener('change', reload);

					elKeyword.addEventListener('keydown', async (e) => {
						if (e.key !== 'Enter') return;
						e.preventDefault();
						await reload();
					});
				}

				function initInfiniteScroll() {
					if (window.AdminUtils && typeof window.AdminUtils.createInfiniteObserver === 'function') {
						observer = window.AdminUtils.createInfiniteObserver(elSentinel, async () => {
							await loadNextPage();
						});
					}
				}

				async function init() {
					initEvents();
					initInfiniteScroll();
					await reload();
				}

				window.addEventListener('DOMContentLoaded', init);
			})();
		</script>
		
	</th:block>
</body>
</html>
