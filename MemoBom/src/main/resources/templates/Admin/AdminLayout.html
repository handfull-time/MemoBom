<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{Common/LayoutBase}">
<header>
	<title layout:fragment="title">관리-<th:block layout:fragment="admin_title"></th:block></title>
</header>


<th:block layout:fragment="header">
	<th:block th:replace="~{Fragments/Header :: MenuHeader(menuOpenFn='AdminMenu.open()', title='관리')}"></th:block>
</th:block>

<th:block layout:fragment="css">
	<th:block layout:fragment="admin_css"></th:block>
</th:block>

<body>
	<th:block layout:fragment="content">
		<div class="h-full flex">

			<!-- PC: 좌측 고정 메뉴 (md 이상에서만 보임) -->
			<aside class="hidden md:block w-56 shrink-0 border-r border-gray-200 bg-white">
				<div class="p-3 text-dynamic-sm font-semibold text-gray-700">관리</div>
				<div class="px-2 pb-3">
					<th:block th:replace="~{Admin/AdminMenu :: Menu}"></th:block>
				</div>
			</aside>

			<!-- Right contents -->
			<section class="flex-1 min-w-0 bg-slate-50 p-3">
				<th:block layout:fragment="admin_content"></th:block>
			</section>
		</div>

		<!-- Mobile: 드로어(오버레이) -->
		<div id="adminMenuDrawer" class="fixed inset-0 z-[9999] hidden md:hidden">
			<!-- backdrop -->
			<div class="absolute inset-0 bg-black/40" onclick="AdminMenu.close()"></div>

			<!-- panel -->
			<div
				class="absolute left-0 top-0 h-full w-[40%] max-w-xs bg-white shadow-xl border-r border-gray-200 translate-x-0">
				<div class="h-12 flex items-center justify-between px-3 border-b border-gray-200">
					<div class="font-semibold">관리자</div>
					<button type="button" class="p-2 rounded-lg hover:bg-gray-100" onclick="AdminMenu.close()"
						aria-label="닫기">
						<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
							<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" />
						</svg>
					</button>
				</div>

				<div class="p-2">
					<th:block th:replace="~{Admin/AdminMenu :: Menu}"></th:block>
				</div>
			</div>
		</div>
	</th:block>


	<th:block layout:fragment="footer">
		<th:block th:replace="~{Fragments/Footer :: AdminFooter}"></th:block>
	</th:block>

	<th:block layout:fragment="script">

		<script>
			window.AdminMenu = {
				open() {
					const el = document.getElementById('adminMenuDrawer');
					if (!el) return;
					el.classList.remove('hidden');
					document.body.style.overflow = 'hidden';
				},
				close() {
					const el = document.getElementById('adminMenuDrawer');
					if (!el) return;
					el.classList.add('hidden');
					document.body.style.overflow = '';
				},
				closeIfMobile() {
					// md 미만일 때만 닫기
					if (window.matchMedia('(max-width: 767px)').matches) {
						this.close();
					}
				}
			};

			window.AdminUtils = {
				DATE_STORAGE_KEY: 'admin.search.date',

				text(value, fallback = '-') {
					if (value === null || value === undefined) return fallback;
					const normalized = String(value).trim();
					return normalized ? normalized : fallback;
				},

				toastInfo(message, duration = 1300) {
					showToast('안내', message, ToastType.INFO, duration);
				},

				toastSuccess(message, duration = 1200) {
					showToast('완료', message, ToastType.SUCCESS, duration);
				},

				toastError(message, duration = 1800) {
					showToast('오류', message, ToastType.ERROR, duration);
				},

				openDatePicker(input) {
					if (!input || typeof input.showPicker !== 'function') return;
					try {
						input.showPicker();
					} catch (error) {
						if (!(error instanceof DOMException && error.name === 'NotAllowedError')) {
							console.error(error);
						}
					}
				},

				bindDatePickerOpener(input) {
					if (!input) return;
					const open = () => this.openDatePicker(input);
					input.addEventListener('click', open);
				},
				
				/**
				 * 무한 스크롤 관찰자 생성
				 * @param {Element} sentinel 관찰 대상 element
				 * @param {() => Promise<void>} onIntersect 교차 시 실행할 비동기 함수
				 * @param {Object} options IntersectionObserver 옵션
				 * @returns {IntersectionObserver|null}
				 */
				createInfiniteObserver(sentinel, onIntersect, options = {}) {
					if (!sentinel || typeof onIntersect !== 'function') return null;
					if (typeof IntersectionObserver !== 'function') return null;

					const observer = new IntersectionObserver(async (entries) => {
						if (!entries[0] || !entries[0].isIntersecting) return;
						await onIntersect();
					}, {
						root: null,
						rootMargin: options.rootMargin || '300px 0px',
						threshold: options.threshold ?? 0
					});
					observer.observe(sentinel);
					return observer;
				},

				getTodayDate() {
					const now = new Date();
					const y = now.getFullYear();
					const m = String(now.getMonth() + 1).padStart(2, '0');
					const d = String(now.getDate()).padStart(2, '0');
					return `${y}-${m}-${d}`;
				},

				normalizeDate(value) {
					const raw = String(value || '').trim();
					if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return '';
					const dt = new Date(`${raw}T00:00:00`);
					if (Number.isNaN(dt.getTime())) return '';
					return raw;
				},

				loadDateFromStorage() {
					try {
						return this.normalizeDate(localStorage.getItem(this.DATE_STORAGE_KEY));
					} catch (e) {
						return '';
					}
				},

				saveDateToStorage(value) {
					const normalized = this.normalizeDate(value) || this.getTodayDate();
					try {
						localStorage.setItem(this.DATE_STORAGE_KEY, normalized);
					} catch (e) {
						// ignore
					}
					return normalized;
				},

				bindDateInput(input) {
					if (!input) return;
					const current = this.normalizeDate(input.value);
					const stored = this.loadDateFromStorage();
					const applied = current || stored || this.getTodayDate();
					input.value = applied;
					this.saveDateToStorage(applied);
					
					input.addEventListener('change', () => {
						const changed = this.normalizeDate(input.value) || this.getTodayDate();
						input.value = changed;
						this.saveDateToStorage(changed);
					});
				},

				initDatePersistence(root = document) {
					const inputs = root.querySelectorAll('input[type="date"][name="date"]');
					inputs.forEach((input) => this.bindDateInput(input));
				}
			};

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', () => {
					window.AdminUtils.initDatePersistence();
				});
			} else {
				window.AdminUtils.initDatePersistence();
			}

			// ESC로 닫기
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') AdminMenu.close();
			});
			
		</script>


		<th:block layout:fragment="admin_script"></th:block>
	</th:block>

</body>

</html>
