<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{Common/LayoutBase}">

<header>
	<th:block layout:fragment="title">얘깃거리 초대</th:block>
</header>

<th:block layout:fragment="header">
	<th:block th:replace="~{Fragments/Header :: Header_Back('얘깃거리 초대')}"></th:block>
</th:block>

<th:block layout:fragment="content">
	<div class="mx-auto w-full px-4 py-4 space-y-4">
		<section class="bg-blue-50 rounded-2xl border border-blue-200 p-4">
			<h2 class="text-dynamic-base font-semibold text-blue-900">얘깃거리 초대가 도착했어요</h2>
			<p class="mt-1 text-dynamic-sm text-blue-800">아래 얘깃거리 정보를 확인하고 가입 여부를 선택해 주세요.</p>
		</section>

			<section class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
				<div class="flex items-center gap-3">
					<div class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center text-dynamic-2xl"
						th:text="${topic.imogi ?: '📌'}">📌</div>
					<div class="min-w-0">
						<div class="text-dynamic-base font-semibold text-slate-900 break-words" th:text="${topic.name}">얘깃거리명</div>
						<div class="text-dynamic-xs text-slate-500">
							얘깃거리 생성자: <span th:text="${topic.user.nickname}">별명</span>
						</div>
					</div>
				</div>
				<div class="rounded-xl bg-slate-50 px-3 py-2 text-dynamic-sm text-slate-700">
					<div>
						초대한 사람:
						<span class="font-semibold" th:text="${inviter != null ? inviter.nickname : '확인 불가'}">초대자</span>
					</div>
				</div>
				<div class="text-dynamic-sm text-slate-700 whitespace-pre-line break-words"
					th:text="${topic.description ?: '얘깃거리 설명이 없습니다.'}">얘깃거리 설명</div>
			</section>

		<section th:if="${pendingInvite}" class="grid grid-cols-2 gap-2">
			<button type="button" id="btnInviteReject"
				class="h-12 rounded-2xl border border-slate-200 bg-white text-slate-700 font-semibold hover:bg-slate-50 active:scale-[0.99] transition">
				가입 거절
			</button>
			<button type="button" id="btnInviteAccept"
				class="h-12 rounded-2xl bg-slate-900 text-white font-semibold enabled:hover:bg-slate-800 disabled:bg-slate-300 active:scale-[0.99] transition">
				가입 수락
			</button>
		</section>

		<section th:if="${!pendingInvite}" class="bg-slate-100 rounded-2xl p-4 text-dynamic-sm text-slate-600">
			이미 처리된 초대입니다.
		</section>
	</div>
</th:block>

<th:block layout:fragment="script">
	<script th:inline="javascript">
		(() => {
			const btnInviteAccept = document.getElementById("btnInviteAccept");
			const btnInviteReject = document.getElementById("btnInviteReject");

			async function submitInviteDecision(accept) {
				const ask = accept ? "얘깃거리 가입을 수락하시겠습니까?" : "얘깃거리 초대를 거절하시겠습니까?";
				const ok = await confirmP(ask);
				if (!ok) {
					return;
				}

				const url = /*[[@{/Topic/InviteDecision.json}]]*/ '/Topic/InviteDecision.json';
				const payload = {
					topicUid: /*[[${topic.uid}]]*/ null,
					accept
				};

				try {
					const res = await apiPost(url, payload);
					if (!res || res.code !== "0") {
						showToast("오류", res?.message || "초대 처리에 실패했습니다.", ToastType.ERROR);
						return;
					}

					if (accept) {
						await alertP("가입이 완료되었습니다.");
						const address = /*[[@{/Fragment/index.html}]]*/ '/Fragment/index.html';
						location.replace(address + "?topicUid=" + encodeURIComponent(payload.topicUid));
					} else {
						await alertP("초대를 거절했습니다.");
						location.replace(/*[[@{/}]]*/ '/');
					}
				} catch (e) {
					console.error(e);
					showToast("오류", "초대 처리 중 오류가 발생했습니다.", ToastType.ERROR);
				}
			}

			btnInviteAccept?.addEventListener("click", () => submitInviteDecision(true));
			btnInviteReject?.addEventListener("click", () => submitInviteDecision(false));
		})();
	</script>
</th:block>

</html>
